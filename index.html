<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galileu</title>
<meta name="description" content="Galileu — assistente local, movido a curiosidade. Roda inteiramente no seu navegador.">
<meta name="theme-color" content="#0d1321">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" onerror="this.remove()">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <svg class="orbita" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
    <circle cx="17" cy="17" r="2.6" fill="#c99a3c"/>
    <circle cx="17" cy="17" r="12" fill="none" stroke="rgba(201,154,60,0.35)" stroke-width="1"/>
    <g class="ponto">
      <circle cx="29" cy="17" r="1.8" fill="#f2ead3"/>
    </g>
  </svg>
  <div class="titulo-bloco">
    <h1>Galileu</h1>
    <div class="tagline">assistente local, movido a curiosidade</div>
  </div>
</header>

<div id="chat">
  <div class="vazio" id="vazio">Pergunte alguma coisa — força, gravidade, buraco negro, ou o que quiser.</div>
</div>

<form id="form">
  <input id="entrada" type="text" placeholder="Escreva sua mensagem..." autocomplete="off" autofocus>
  <button type="submit" aria-label="Enviar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
    </svg>
  </button>
</form>

<script src="app.js"></script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const entrada = document.getElementById('entrada');
const vazio = document.getElementById('vazio');
const botao = form.querySelector('button');

function rolar() { chat.scrollTop = chat.scrollHeight; }

function adicionarLinha(quem, texto) {
  if (vazio) vazio.remove();
  const linha = document.createElement('div');
  linha.className = 'linha ' + quem;
  const bolha = document.createElement('div');
  bolha.className = 'bolha';
  bolha.textContent = texto;
  linha.appendChild(bolha);
  chat.appendChild(linha);
  rolar();
}

function mostrarDigitando() {
  const linha = document.createElement('div');
  linha.className = 'linha galileu';
  linha.id = 'digitando-linha';
  linha.innerHTML = '<div class="bolha"><div class="digitando"><span></span><span></span><span></span></div></div>';
  chat.appendChild(linha);
  rolar();
}

function removerDigitando() {
  const el = document.getElementById('digitando-linha');
  if (el) el.remove();
}

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const texto = entrada.value.trim();
  if (!texto) return;

  adicionarLinha('voce', texto);
  entrada.value = '';
  entrada.disabled = true;
  botao.disabled = true;
  mostrarDigitando();

  // Pequeno atraso só pra dar sensação de resposta acontecendo,
  // já que o cálculo real é instantâneo (roda local no navegador).
  setTimeout(() => {
    let resposta;
    try {
      resposta = pensar(texto);
    } catch (erro) {
      resposta = 'Ocorreu um erro ao processar: ' + erro.message;
    }
    adicionarHistorico(texto, resposta);
    removerDigitando();
    adicionarLinha('galileu', resposta);
    entrada.disabled = false;
    botao.disabled = false;
    entrada.focus();
  }, 350 + Math.random() * 300);
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
